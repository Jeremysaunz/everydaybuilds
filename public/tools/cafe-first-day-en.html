.drink-station{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;margin:20px 0;background:#edf0e7;border:1px solid #dce3d5;border-radius:18px;padding:22px}.cup-zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:330px;border:2px dashed transparent;border-radius:14px;transition:background .2s,border-color .2s}.cup-zone.drag-over{border-color:var(--green);background:#dde8d8}.cup-scene{height:242px;width:190px;position:relative;display:flex;justify-content:center;align-items:end;padding-bottom:12px}.cup-shadow{position:absolute;bottom:0;width:165px;height:18px;background:#344a3920;border-radius:50%}.live-cup{width:145px;height:202px;position:relative;z-index:1;border:3px solid #9fafaa;border-top:5px solid #82988d;border-radius:7px 7px 28px 28px;background:#ffffff65;box-shadow:inset 8px 0 9px #ffffff70,8px 8px 15px #3c534012;overflow:hidden;transform:perspective(500px) rotateX(-3deg)}.live-cup:after{content:'';position:absolute;inset:7px 9px 10px auto;width:9px;background:#ffffff50;border-radius:6px;z-index:5;pointer-events:none}.drink-liquid{position:absolute;left:0;right:0;box-shadow:inset 0 3px 0 #ffffff45;animation:liquid-in .65s ease-out both}.drink-liquid.coffee{background:linear-gradient(#76492b,#472b1c)}.drink-liquid.milk{background:linear-gradient(#fffef2,#efe7ce)}.drink-liquid.water{background:linear-gradient(#afd5e5bb,#98c5dccc)}.drink-liquid.syrup{background:#d6a44c}.drink-liquid.tea{background:linear-gradient(#edb465,#c58436)}.drink-liquid.other{background:#c7d9ab}.drink-liquid.water.coffee-water{background:linear-gradient(#b98b59,#815536)}.drink-liquid.water.tea-water{background:linear-gradient(#e9bd77,#d19a49)}.drink-liquid.milk.with-coffee{background:linear-gradient(#cb9b70 0%,#eee0c1 28%,#f8eed6 80%)}.coffee + .milk{background:linear-gradient(#fff9e7,#c69971)}.milk + .coffee{background:linear-gradient(#5e3520,#b8875b)}.ice-pieces{position:absolute;inset:0;z-index:3;pointer-events:none}.ice-piece{position:absolute;width:33px;height:31px;border:2px solid #f7ffffb0;background:linear-gradient(140deg,#efffffc9,#bde0ed50);border-radius:7px;box-shadow:inset 2px 2px 5px #ffffff90;animation:ice-drop .65s cubic-bezier(.2,.8,.3,1) both}.cup-lid{position:absolute;left:14px;right:14px;bottom:208px;border:3px solid #768b80;background:#e4e8dc;height:15px;border-radius:8px 8px 3px 3px;z-index:8}.pour-stream{position:absolute;left:91px;top:0;width:9px;height:185px;z-index:4;background:var(--pour-color);border-radius:9px;animation:pour .7s ease-out both;pointer-events:none}.cup-label{margin:16px 0 8px;font-weight:850;font-size:14px;text-align:center}.drink-status{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}.cup-contents{font-size:12px;line-height:1.6;max-width:190px;text-align:center;margin:6px 0;color:#465c4c}.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.shelf-head h3{margin:0;font-size:16px}.ingredient-shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ingredient-button{display:flex;align-items:center;gap:10px;text-align:left;min-height:77px;padding:12px;background:#fffdf8;border:1px solid #d9dfd1;border-radius:12px;color:var(--ink)}.ingredient-button:hover{border-color:var(--green);box-shadow:0 3px 9px #354e3312}.ingredient-button.selected{background:#e0e8d9}.ingredient-button.wrong{border-color:var(--red);background:#fff1eb}.ingredient-button strong{display:block;font-size:14px}.ingredient-button small{display:block;font-size:11px;line-height:1.5;margin-top:3px;color:var(--muted)}.ingredient-swatch{width:28px;height:39px;border:2px solid #87988b;border-radius:4px 4px 10px 10px;background:linear-gradient(transparent 25%,var(--ingredient-color) 25%);flex-shrink:0}.ingredient-swatch.tool{border-radius:6px;background:var(--ingredient-color);height:28px}.station-note{font-size:11px;color:var(--muted);line-height:1.7;margin:12px 0 0}.cup-reset{padding:7px 11px;min-height:36px;font-size:12px}.contaminated{border-color:#bc7566;background:#f5e5dc}.remake-alert{margin:12px 0 0;color:var(--red);font-size:13px;font-weight:700;line-height:1.6}.steam-cloud{position:absolute;top:5px;left:55px;font-size:12px;line-height:1.8;letter-spacing:8px;color:#6c7d6e;animation:steam 1.5s ease-in-out infinite}.station-idle{font-size:12px;letter-spacing:.1em;color:var(--muted);position:absolute;top:95px;left:0;right:0;text-align:center}.station-finished{display:block}.finished-drink{max-width:220px;margin:18px auto}.finished-drink .cup-zone{min-height:290px}.finished-drink .drink-station{display:block;padding:10px;border:0;margin:0}.finished-drink .ingredient-area,.finished-drink .cup-reset,.finished-drink .station-note{display:none}.workbench .drink-station + .choice-grid{margin-top:18px}
@keyframes liquid-in{from{transform:scaleY(.05);transform-origin:bottom;opacity:.4}to{transform:scaleY(1);transform-origin:bottom;opacity:1}}@keyframes ice-drop{from{translate:0 -130px;opacity:0}to{translate:0 0;opacity:1}}@keyframes pour{0%{opacity:0;transform:scaleY(0);transform-origin:top}20%,70%{opacity:1;transform:scaleY(1);transform-origin:top}100%{opacity:0;transform:scaleY(.4);transform-origin:bottom}}@keyframes steam{50%{translate:0 -6px;opacity:.5}}
@media(max-width:1100px){.drink-station{grid-template-columns:180px minmax(0,1fr);padding:15px;gap:12px}.ingredient-shelf{grid-template-columns:1fr}.cup-scene{width:170px}.pour-stream{left:81px}}
@media(max-width:650px){.drink-station{grid-template-columns:1fr;padding:15px}.cup-zone{min-height:295px}.ingredient-shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.ingredient-button{padding:10px;gap:7px}.ingredient-button strong{font-size:13px}.ingredient-button small{font-size:10px}.cup-scene{height:215px}.live-cup{height:180px;width:135px}.cup-lid{bottom:186px}.pour-stream{height:160px}.cup-label{margin-top:10px}}
@media(prefers-reduced-motion:reduce){.drink-liquid,.ice-piece,.pour-stream,.steam-cloud{animation:none}.pour-stream{display:none}}

.topbar-end{display:flex;align-items:center;gap:20px}.game-language{display:flex;flex:none;gap:3px;padding:4px;background:#e3eadd;border:1px solid #c8d4c4;border-radius:11px}.game-language button{min-height:36px;padding:7px 11px;border:0;border-radius:7px;background:transparent;color:#35513e;font-size:13px;font-weight:750;white-space:nowrap}.game-language button[aria-pressed=true]{background:var(--green);color:#fff}.game-language button:hover{background:#d1decb}.game-language button[aria-pressed=true]:hover{background:#214535}@media(max-width:650px){.topbar{gap:12px;flex-wrap:wrap}.topbar-end{gap:0}.game-language button{min-height:36px;padding:7px 9px;font-size:12px}.brand{font-size:19px;gap:8px}.brand-mark{width:30px;height:30px}.top-note{display:none}}@media print{.game-language{display:none}}
</style>

function normalizeRecipe(item,ids){
 if(!item||typeof item!=='object')throw Error('레시피 형식이 올바르지 않습니다.');

 if(!Array.isArray(item.steps)||item.steps.length<2||item.steps.length>12)throw Error('제조 순서는 2~12단계가 필요합니다.');

 if(steps.some(v=>!v||v.length>120)||new Set(steps.map(v=>v.toLowerCase())).size!==steps.length)throw Error('제조 단계는 각각 1~120자로, 중복 없이 적으세요.');
 const raw=item.ingredients??[];
 if(!Array.isArray(raw)||raw.length>8)throw Error('계량 재료는 최대 8개입니다.');
 const ingredients=raw.map(v=>({name:String(v.name||'').trim(),amount:Number(v.amount),unit:cafeUnit(String(v.unit||''),locale)}));
 if(ingredients.some(v=>!v.name||v.name.length>30||!Number.isFinite(v.amount)||v.amount<=0||v.amount>10000||!['ml','g','샷','펌프','개'].includes(v.unit)))throw Error('계량 재료의 이름·양·단위를 확인하세요. 양은 0보다 크고 10,000 이하로 적으세요.');
 if(new Set(ingredients.map(v=>v.name.toLowerCase())).size!==ingredients.length)throw Error('계량 재료 이름은 서로 다르게 적으세요.');
 const size=String(item.size||'').trim(),notes=String(item.notes||'').trim();
 if(size.length>30||notes.length>600)throw Error('컵 크기는 30자, 매장 메모는 600자까지 입력할 수 있습니다.');
 ids.add(id);return {id,name,cup,steps,size,notes,ingredients,confirmed:item.confirmed===true};
}

function classifyEnglish(label){
 if(/pull|extract/i.test(label)&&!/cup|pour|add/i.test(label))return {kind:'extract',name:'Pull espresso',tool:true};
 if(/steam/i.test(label)&&!/pour|add|cup/i.test(label))return {kind:'steam',name:'Steam milk',tool:true};
 if(/lid|exterior|finish/i.test(label))return {kind:'lid',name:'Finish cup',tool:true};
 if(/prepare/i.test(label))return {kind:'prepare',name:'Prepare cup',tool:true};
 if(/ice(?!d)/i.test(label))return {kind:'ice',name:'Add ice'};
 if(/milk/i.test(label))return {kind:'milk',name:/steam/i.test(label)?'Pour steamed milk':'Pour milk'};

 if(/tea|tea base/i.test(label))return {kind:'tea',name:'Add tea base'};

}

function startQuiz(ids){const selectedQuestions=ids?questions.filter(q=>ids.includes(q.id)):questions;quiz={queue:shuffle(selectedQuestions),index:0,answers:[],chosen:null};renderBasics()}
function renderBasics(){
 const header=title('FIRST SHIFT BASICS','첫날 기본기','음료를 만들기 전, 현장에서 필요한 판단을 연습해요.');
 let question;
 if(!quiz){question=`<div class="panel question-card"><span class="eyebrow">9 EVERYDAY SITUATIONS</span><h2>모르면 확인하는 습관부터.</h2><p>주문 확인, 손과 도구 위생, 알레르기 요청, 우유와 장비 관리, 실수 대응을 짧은 상황으로 익혀요. 각 답 뒤에 이유를 설명합니다.</p><div class="actions"><button class="primary" id="start-basics">9개 상황 연습</button>${basicRecord.missed.length?'<button class="secondary" id="retry-basics">틀린 상황만 복습</button>':''}</div><p class="small" style="margin-top:22px">게임은 생각을 연습하는 도구입니다. 손 씻기, 계량, 추출, 스팀은 매장에서 직접 배우세요.</p></div>`}
 else if(quiz.index>=quiz.queue.length){const correct=quiz.answers.filter(v=>v.correct).length;question=`<div class="panel question-card"><span class="eyebrow">BASICS COMPLETE</span><h2>상황 연습을 마쳤어요</h2><div class="result-score">${correct} / ${quiz.queue.length}</div><p>각 상황의 첫 답 기준입니다. 틀린 상황은 이유를 다시 읽고 복습하세요.</p>${quiz.answers.filter(v=>!v.correct).map(v=>{const q=questions.find(q=>q.id===v.id);return `<div class="review-item"><strong>${E(q.topic)}</strong>${E(q.why)}</div>`}).join('')}<div class="actions"><button class="primary" data-go="home">음료 실습으로</button>${quiz.answers.some(v=>!v.correct)?'<button class="secondary" id="retry-current-basics">이번에 틀린 상황 복습</button>':''}<button class="quiet" id="start-basics">전체 다시 풀기</button></div></div>`}
 else{const q=quiz.queue[quiz.index],answered=quiz.chosen!==null,isCorrect=quiz.chosen===q.correct;question=`<div class="panel question-card"><div class="setup-head"><span class="tag">${E(q.topic)}</span><span class="small">${quiz.index+1} / ${quiz.queue.length}</span></div><h2>${E(q.title)}</h2><div class="choice-grid">${q.answers.map((a,i)=>`<button class="choice ${answered&&i===q.correct?'selected':''} ${answered&&i===quiz.chosen&&!isCorrect?'wrong':''}" data-basic-answer="${i}" ${answered?'disabled':''}>${E(a)}</button>`).join('')}</div>${answered?`<div class="answer-explanation ${isCorrect?'':'incorrect'}" role="status"><strong>${isCorrect?'맞아요.':'이렇게 생각해 보세요.'}</strong><br>${E(q.why)}${!isCorrect?`<br><strong>권장 행동: ${E(q.answers[q.correct])}</strong>`:''}</div><div class="actions"><button class="primary" id="next-basic">${quiz.index===quiz.queue.length-1?'결과 보기':'다음 상황'}</button></div>`:'<p class="small">가장 적절한 행동 하나를 선택하세요.</p>'}</div>`}
 $('#basics-view').innerHTML=header+`<div class="foundation-layout"><div>${question}<div class="sources">교육 범위 참고: <a href="https://education.sca.coffee/coffee-skills-program" target="_blank" rel="noopener">SCA 바리스타 교육</a> · <a href="https://www.food.gov.uk/business-guidance/allergen-guidance-for-food-businesses" target="_blank" rel="noopener">FSA 알레르기 관리</a><br>일반 교육 원칙을 참고한 상황 예시입니다. 국내 법정 교육과 매장 절차는 담당자에게 확인하세요.</div></div><aside class="panel"><div class="setup-head"><h2>매장에서 확인할 것</h2><span class="tag" id="check-count">${checks.length} / ${checklist.length}</span></div><p>실제로 배운 항목만 체크하세요. 공용 기기에서 사용한다면 새 교육생 시작 시 체크를 지워 주세요.</p><div class="checklist">${checklist.map(([name,detail],i)=>`<label class="check-item"><input type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span><strong>${E(name)}</strong><small>${E(detail)}</small></span></label>`).join('')}</div><div class="actions"><button class="quiet" id="print-checklist">체크리스트 인쇄</button><button class="quiet" id="clear-checklist">체크 지우기</button></div></aside></div>`;
}
function answerBasic(index){if(!quiz||quiz.chosen!==null||quiz.index>=quiz.queue.length)return;const q=quiz.queue[quiz.index],correct=index===q.correct;quiz.chosen=index;quiz.answers.push({id:q.id,correct});if(!basicRecord.seen.includes(q.id)){basicRecord.seen.push(q.id);if(correct)basicRecord.firstCorrect.push(q.id)}basicRecord.missed=basicRecord.missed.filter(v=>v!==q.id);if(!correct)basicRecord.missed.push(q.id);write(BASIC,basicRecord);renderBasics();$('#next-basic')?.focus({preventScroll:true})}
function amountTable(r){return r.ingredients.length?`<table class="amount-table"><caption style="text-align:left;font-weight:800">매장 계량 기준</caption><tbody>${r.ingredients.map(v=>`<tr><td>${E(v.name)}</td><td>${v.amount} ${E(v.unit)}</td></tr>`).join('')}</tbody></table>`:'<div class="inline-note">계량 기준이 아직 없습니다. 매장 설정에서 재료별 양을 입력하면 실습에 출제됩니다.</div>'}
function recipeDetail(r){return `<div class="detail-grid recipe-details" id="recipe-detail"><div class="panel"><span class="eyebrow">RECIPE STANDARD</span><h2 style="margin-top:10px">${E(r.name)}</h2>${badge(r)}<p style="margin-top:15px">컵: ${E(cups[r.cup])}<br>크기: ${E(r.size||'매장 기준 확인 필요')}</p>${amountTable(r)}${r.notes?`<div class="guided"><strong>매장 메모</strong><br>${E(r.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="actions"><button class="primary" data-practice-recipe="${E(r.id)}">이 음료 3잔 연습</button><button class="quiet" id="edit-selected">레시피 수정</button></div></div><div class="panel"><h2>제조 순서</h2><ol class="recipe-steps">${r.steps.map(v=>`<li>${E(v)}</li>`).join('')}</ol><div class="inline-note">제조 전 주문 확인 → 제조 후 주문 대조와 컵 상태 확인</div></div></div>`}
function renderLibrary(){const r=recipes.find(r=>r.id===selected)||recipes[0];selected=r.id;$('#library-view').innerHTML=title('RECIPE NOTE','레시피 노트','매장 기준을 읽고, 필요한 음료부터 익혀요.')+`<div class="search-row"><input id="recipe-search" type="search" placeholder="음료 이름 검색" aria-label="음료 이름 검색"><button class="quiet" id="print-recipes">레시피 인쇄</button></div><div class="recipe-grid" id="recipe-grid">${recipes.map(v=>`<button class="recipe-card" data-recipe="${E(v.id)}" aria-pressed="${v.id===selected}"><div class="top"><span class="mini">${v.cup==='hot'?'HOT':v.cup==='blended'?'BLENDED':'ICED'}</span>${badge(v)}</div><h3>${E(v.name)}</h3><p>${v.steps.length}단계 · ${E(v.size||'크기 미입력')}</p></button>`).join('')}</div><p id="search-empty" class="menu-empty hidden">일치하는 음료가 없습니다.</p>${recipeDetail(r)}`}
function quantityRow(v={name:'',amount:'',unit:'ml'},i=0){return `<div class="quantity-row"><input aria-label="재료 ${i+1} 이름" data-q-name maxlength="30" placeholder="예: 우유" value="${E(v.name)}"><input aria-label="재료 ${i+1} 양" data-q-amount type="number" min="0.01" max="10000" step="any" placeholder="양" value="${E(v.amount)}"><select aria-label="재료 ${i+1} 단위" data-q-unit>${['ml','g','샷','펌프','개'].map(unit=>`<option ${unit===v.unit?'selected':''}>${unit}</option>`).join('')}</select><button type="button" data-remove-quantity aria-label="재료 ${i+1} 삭제">삭제</button></div>`}
function renderSettings(){const r=recipes.find(r=>r.id===editing);$('#settings-view').innerHTML=title('STORE SETUP','매장 설정','예시를 매장 기준으로 바꾸면 교육이 더 정확해져요.')+`<div class="notice"><strong>설정 순서</strong> · 음료 선택 → 컵 크기와 계량 입력 → 제조 순서 확인 → 매장 확인 체크 → 저장<br>원두, 장비, 컵 크기에 따라 기준이 달라집니다. 추출량·시간과 우유 스팀 기준 등은 매장 메모에 적으세요.</div><div class="detail-grid"><div class="panel"><h2>메뉴 ${recipes.length}개</h2><div class="settings-list">${recipes.map(v=>`<button class="navbtn ${v.id===editing?'active':''}" data-edit="${E(v.id)}">${E(v.name)}<br><small style="font-weight:500">${v.confirmed?'매장 확인됨':'확인 전'}</small></button>`).join('')}</div><div class="actions"><button class="secondary" id="new-recipe">새 음료 추가</button><button class="quiet" id="duplicate-recipe" ${r?'':'disabled'}>선택 음료 복제</button></div></div><div class="panel"><h2>${r?'레시피 편집':'새 음료 추가'}</h2><form id="recipe-form"><div id="form-error" class="form-error hidden" role="alert"></div><div class="form-grid"><div class="field"><label for="recipe-name">음료 이름</label><input id="recipe-name" maxlength="40" required value="${E(r?.name||'')}" placeholder="예: 아이스 카페라떼"></div><div class="field"><label for="recipe-cup">컵 종류</label><select id="recipe-cup">${Object.entries(cups).map(([key,label])=>`<option value="${key}" ${key===(r?.cup||'cold')?'selected':''}>${E(label)}</option>`).join('')}</select></div></div><div class="field"><label for="recipe-size">컵 크기 / 제공 규격</label><input id="recipe-size" maxlength="30" value="${E(r?.size||'')}" placeholder="예: 매장 기본 16oz 컵"></div><div class="field"><label>계량할 재료</label><span class="field-help">실제 매장 값을 입력하세요. 비워 두면 계량 문제를 출제하지 않습니다.</span><div class="quantity-labels"><span>재료 이름</span><span>양</span><span>단위</span><span></span></div><div id="quantity-rows">${(r?.ingredients||[]).map(quantityRow).join('')}</div><button type="button" class="quiet" id="add-quantity">재료 한 줄 추가</button></div><div class="field"><label for="recipe-steps">제조 순서</label><textarea id="recipe-steps" required>${E(r?.steps.join('\n')||'')}</textarea><span class="field-help">한 줄에 한 단계씩 2~12단계. 겹치는 단계는 이름을 구분해 주세요.</span></div><div class="field"><label for="recipe-notes">매장 메모 / 품질 기준</label><textarea id="recipe-notes" maxlength="600" style="min-height:100px" placeholder="원두 투입량, 추출량·시간, 스팀 기준, 성분·알레르기 확인 위치 등">${E(r?.notes||'')}</textarea></div><label class="check-item"><input id="recipe-confirmed" type="checkbox" ${r?.confirmed?'checked':''}><span>교육 담당자가 실제 매장 레시피와 대조했습니다.</span></label><div class="actions"><button class="primary" type="submit">레시피 저장</button><button class="danger" type="button" id="delete-recipe" ${!r||recipes.length===1?'disabled':''}>음료 삭제</button></div></form></div></div><div class="panel" style="margin-top:17px"><h2>백업과 복원</h2><p>저장은 이 브라우저에만 남습니다. 브라우저 데이터 삭제나 파일 이동 전 JSON으로 백업하세요. JSON에는 레시피만 포함됩니다.</p><div class="settings-actions"><button class="quiet" id="export-recipes">JSON 내보내기</button><button class="quiet" id="import-trigger">JSON 불러오기</button><button class="quiet" id="undo-recipes" ${recipeBackup?'':'disabled'}>직전 변경 되돌리기</button><button class="danger" id="reset-recipes">예시로 초기화</button><input type="file" id="import-file" accept=".json,application/json" class="hidden" aria-label="레시피 JSON 선택"></div><div id="import-preview"></div></div>`;formDirty=false}
function commitRecipes(next,message){const validated=validate(next);recipeBackup=copy(recipes);write(BACKUP,recipeBackup);recipes=validated;const saved=write(STORAGE,recipes);editing=recipes.some(r=>r.id===editing)?editing:recipes[0].id;selected=editing;formDirty=false;renderSettings();showToast(saved?message:'현재 화면에만 적용했습니다. 브라우저 저장이 제한되어 JSON으로 백업해야 합니다.')}
function saveForm(event){event.preventDefault();try{const ingredients=[...document.querySelectorAll('.quantity-row')].map(row=>({name:row.querySelector('[data-q-name]').value,amount:row.querySelector('[data-q-amount]').value,unit:row.querySelector('[data-q-unit]').value}));const draft={id:editing||uid(),name:$('#recipe-name').value,cup:$('#recipe-cup').value,size:$('#recipe-size').value,steps:$('#recipe-steps').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean),ingredients,notes:$('#recipe-notes').value,confirmed:$('#recipe-confirmed').checked};const next=copy(recipes),index=next.findIndex(r=>r.id===editing);if(index>=0)next[index]=draft;else next.push(draft);validate(next);editing=draft.id;commitRecipes(next,'레시피를 저장했습니다.')}catch(error){const node=$('#form-error');node.textContent=error.message;node.classList.remove('hidden');node.scrollIntoView({block:'center'})}}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importFile(file){if(!file)return;try{if(file.size>500000)throw Error('500KB 이하 JSON 파일을 선택하세요.');pendingImport=validate(JSON.parse(await file.text()));$('#import-preview').innerHTML=`<div class="inline-note"><strong>${pendingImport.length}개 레시피를 읽었습니다.</strong><p>${pendingImport.map(r=>E(r.name)).join(' · ')}</p><p>적용하면 현재 레시피를 교체합니다. 직전 변경 되돌리기로 복원할 수 있습니다.</p><button class="primary" id="apply-import">이 레시피로 교체</button> <button class="quiet" id="cancel-import">취소</button></div>`}catch(error){showToast('불러오기 실패: '+error.message)}}
function printContent(html){$('#print-area').innerHTML='<div class="print-page">'+html+'</div>';window.print()}
function printRecipes(){printContent('<h1>카페 첫날 · 매장 레시피</h1><p>제조 전 주문 확인, 제조 후 주문 대조와 컵 상태 확인</p>'+recipes.map(r=>`<article class="print-recipe"><h2>${E(r.name)}</h2><p>${r.confirmed?'매장 확인됨':'예시 / 매장 확인 필요'} · ${E(cups[r.cup])} · ${E(r.size||'크기 확인 필요')}</p>${amountTable(r)}<ol>${r.steps.map(v=>`<li>${E(v)}</li>`).join('')}</ol>${r.notes?`<p>${E(r.notes).replace(/\n/g,'<br>')}</p>`:''}</article>`).join(''))}
listen(document,'submit',e=>{if(e.target.id==='recipe-form')saveForm(e)});
listen(document,'input',e=>{if(e.target.closest('#recipe-form'))formDirty=true;if(e.target.id==='recipe-search'){const term=e.target.value.trim().toLowerCase();let visible=0;document.querySelectorAll('[data-recipe]').forEach(b=>{const matches=b.textContent.toLowerCase().includes(term);b.classList.toggle('hidden',!matches);if(matches)visible++});$('#search-empty').classList.toggle('hidden',visible>0)}});
listen(document,'change',e=>{if(e.target.matches('[data-check]')){const i=Number(e.target.dataset.check);checks=checks.filter(v=>v!==i);if(e.target.checked)checks.push(i);write(CHECKS,checks);$('#check-count').textContent=checks.length+' / '+checklist.length}if(e.target.id==='import-file'){importFile(e.target.files[0]);e.target.value=''}if(e.target.closest('#recipe-form'))formDirty=true});
listen(window,'beforeunload',e=>{if(formDirty){e.preventDefault();e.returnValue=''}});
listen(document,'click',e=>{
 const target=e.target.closest('button,a');if(!target)return;
 const go=target.dataset.view||target.dataset.go;if(go){setView(go);return}
 if(target.id==='brand'){e.preventDefault();setView('home');return}
 if(target.id==='to-setup'||target.id==='path-practice'){$('#practice-setup').scrollIntoView({behavior:'smooth'});$('#start-home').focus({preventScroll:true});return}
 if(target.id==='start-home'){const list=[...document.querySelectorAll('[name=practice-menu]:checked')].map(v=>recipes.find(r=>r.id===v.value));startSession(list,Number($('#order-count').value),$('[name=mode]:checked').value);return}
 if(target.id==='toggle-menus'){const all=[...document.querySelectorAll('[name=practice-menu]')],next=all.some(v=>!v.checked);all.forEach(v=>v.checked=next);return}
 if(target.hasAttribute('data-answer')){choose(target.dataset.answer);return}
 if(target.id==='reset-drink'&&session?.stage==='steps'){drinkAnimation=null;enterStage('steps');session.feedback='컵을 비웠어요. 첫 제조 단계부터 다시 시작하세요. 실수 기록은 유지됩니다.';renderPractice();return}

function startSession(list,count,mode='guided',retry=false){if(!list.length){showToast('Select at least one drink to practice.');return}const source=shuffle(list);session={queue:Array.from({length:count},(_,i)=>copy(source[i%source.length])),index:0,stage:'order',step:0,amountIndex:0,mode,retry,mistakes:0,hints:0,roundMistakes:0,roundHints:0,scores:[],logs:[],feedback:'Read the order and choose what to check first.',feedbackType:'neutral',choices:[],wrong:null};setView('practice')}
function current(){return session.queue[session.index]}
function choicesFor(r){const all=r.steps.map((label,index)=>({key:'r-'+index,label,index}));const used=new Set(r.steps.map(s=>s.toLowerCase())),usedActions=new Set(r.steps.map(s=>stepAction(s).kind));shuffle(recipes.flatMap(r=>r.steps).concat(defaults.flatMap(r=>r.steps))).filter(s=>{if(used.has(s.toLowerCase())||usedActions.has(stepAction(s).kind))return false;usedActions.add(stepAction(s).kind);used.add(s.toLowerCase());return true}).slice(0,2).forEach((label,i)=>all.push({key:'d-'+i,label,index:-1}));return shuffle(all)}
function amountChoices(ingredient){const v=ingredient.amount,scale=v>=10?Math.max(1,Math.round(v*.2)):1;const nums=[v,Math.max(.1,+(v-scale).toFixed(2)),+(v+scale).toFixed(2)];return shuffle([...new Set(nums)])}

const drinkColors={ice:'#d2edf5',milk:'#f6efd9',coffee:'#744627',water:'#aacddd',syrup:'#d5a14c',tea:'#d89b4b',extract:'#77543a',steam:'#e5dec9',lid:'#ccd6c5',mix:'#b6cbb0',prepare:'#c7d4c3',other:'#c7d9ab'};
function classifyKorean(label){
 if(/추출/.test(label)&&!/컵|붓|담/.test(label))return {kind:'extract',name:'샷 추출',tool:true};
 if(/스팀/.test(label)&&!/붓|담|컵/.test(label))return {kind:'steam',name:'우유 스팀',tool:true};
 if(/뚜껑|외부|마무리/.test(label))return {kind:'lid',name:'컵 마무리',tool:true};
 if(/준비/.test(label))return {kind:'prepare',name:'컵 준비',tool:true};
 if(/얼음/.test(label))return {kind:'ice',name:'얼음 넣기'};
 if(/우유/.test(label))return {kind:'milk',name:/스팀/.test(label)?'스팀 우유 붓기':'우유 붓기'};
 if(/샷|에스프레소/.test(label))return {kind:'coffee',name:'샷 붓기'};
 if(/시럽/.test(label))return {kind:'syrup',name:'시럽 넣기'};
 if(/베이스|아이스티|차|티백/.test(label))return {kind:'tea',name:'티 베이스 넣기'};
 if(/물|온수|정수/.test(label))return {kind:'water',name:/온수/.test(label)?'온수 붓기':'물 붓기'};
 if(/섞|믹|블렌/.test(label))return {kind:'mix',name:'섞기 / 블렌딩',tool:true};
 return {kind:'other',name:'매장 작업',tool:true};
}
function classifyEnglish(label){
 if(/pull|extract/i.test(label)&&!/cup|pour|add/i.test(label))return {kind:'extract',name:'Pull espresso',tool:true};
 if(/steam/i.test(label)&&!/pour|add|cup/i.test(label))return {kind:'steam',name:'Steam milk',tool:true};
 if(/lid|exterior|finish/i.test(label))return {kind:'lid',name:'Finish cup',tool:true};
 if(/prepare/i.test(label))return {kind:'prepare',name:'Prepare cup',tool:true};
 if(/ice(?!d)/i.test(label))return {kind:'ice',name:'Add ice'};
 if(/milk/i.test(label))return {kind:'milk',name:/steam/i.test(label)?'Pour steamed milk':'Pour milk'};
 if(/espresso|shot/i.test(label))return {kind:'coffee',name:'Pour espresso'};
 if(/syrup/i.test(label))return {kind:'syrup',name:'Add syrup'};
 if(/tea|tea base/i.test(label))return {kind:'tea',name:'Add tea base'};
 if(/water/i.test(label))return {kind:'water',name:/hot/i.test(label)?'Pour hot water':'Pour water'};
 if(/stir|mix|blend/i.test(label))return {kind:'mix',name:'Mix / Blend',tool:true};
 return {kind:'other',name:'Café task',tool:true};
}
function stepAction(label){
 const action=/[가-힣]/.test(label)?classifyKorean(label):classifyEnglish(label);
 return {...action,name:translateCafeText(action.name,/[가-힣]/.test(action.name)?'ko':'en',locale)};
}

let drinkAnimation=null;

 const ice=a.filter(v=>v.kind==='ice').length,hasLid=a.some(v=>v.kind==='lid'),shotReady=a.some(v=>v.kind==='extract')&&!a.some(v=>v.kind==='coffee'),steamed=a.some(v=>v.kind==='steam'),contents=liquids.map(v=>({milk:'Milk',water:'Water',coffee:'Espresso',syrup:'Syrup',tea:'Tea'}[v.kind]));if(ice)contents.unshift('Ice');

ingredient-color:${drinkColors[v.kind]}" aria-hidden="true"></span><span><strong>${E(v.name)}</strong><small>${E(o.label)}${o.disabled?' · Done':''}</small></span></button>`}).join('')}</div>${d.spoiled?'<p class="remake-alert">A step was applied out of order. Empty the cup and start the recipe again.</p>':''}<p class="station-note">Drag ingredients into the cup or use the buttons. On a phone, tap the buttons.<br>The cup’s fill level and colors illustrate the steps. Follow your café’s recipe for actual quantities.</p></div>`:''}</div>`;
}

function enterStage(stage){session.stage=stage;session.wrong=null;session.feedback='Check the next step.';session.feedbackType='neutral';if(stage==='cup')session.feedback='Check the drink’s temperature and cup size.';if(stage==='amount'){session.amountIndex=0;session.amountChoices=amountChoices(current().ingredients[0]);session.feedback='Choose the quantity specified in your café’s recipe.'}if(stage==='steps'){session.drink={actions:[],spoiled:false};session.step=0;session.choices=choicesFor(current());session.feedback='Follow the recipe one step at a time.'}if(stage==='handoff')session.feedback='Check once more before serving.';if(stage==='cup')session.feedback='Check the drink’s temperature and cup size.'}
function renderPractice(){
 if(!session){$('#practice-view').innerHTML=title('DRINK PRACTICE','Drink practice','Choose a practice mode and drinks first.')+'<div class="panel"><button class="primary" data-go="home">Choose drinks to practice</button></div>';return}
 if(['steps','handoff','result'].includes(session.stage))ensureDrink();
 write(SESSION,session);
 if(session.stage==='summary')return renderSummary();if(session.stage==='result')return renderRoundResult();
 const r=current(),stages=['order','cup',...(r.ingredients.length?['amount']:[]),'steps','handoff'],stageIndex=stages.indexOf(session.stage),titles={order:'What should you check first?',cup:'Which cup should you use?',amount:'Measure using your café’s recipe',steps:'What comes next?',handoff:'Final check before serving'};
 let options=[],guide='',instruction='';
 if(session.stage==='order'){options=[{key:'confirm',label:'Confirm the drink, temperature, size, extras and quantity'},{key:'guess',label:'Assume it is the usual drink and make it immediately'},{key:'speed',label:'Skip checking to reduce the wait'}];instruction='Read and confirm the order before preparation.';guide='Check size, extras and quantity as well as the drink and temperature.'}
 if(session.stage==='cup'){options=Object.entries(cups).map(([key,label])=>({key,label}));instruction='Choose the cup type that matches the ticket.';guide=`Cup: ${cups[r.cup]} · Size: ${r.size||'Check your café’s cup size'}`}
 if(session.stage==='amount'){const item=r.ingredients[session.amountIndex];options=session.amountChoices.map(v=>({key:String(v),label:`${v} ${item.unit}`}));instruction=`Ingredient ${session.amountIndex+1} / ${r.ingredients.length} · ${item.name}: choose the amount.`;guide=`${item.name}: ${item.amount} ${item.unit}`}
 if(session.stage==='steps'){options=session.choices.filter(v=>v.index>=0||!r.steps.some(s=>stepAction(s).kind===stepAction(v.label).kind)).map(v=>({...v,disabled:v.index>=0&&v.index<session.step}));instruction=`Step ${session.step+1} of ${r.steps.length} · Use the ingredients and tools to make the drink.`;guide=`Next step: ${r.steps[session.step]}`}
 if(session.stage==='handoff'){options=[{key:'check',label:'Check the drink against the order ticket, check the cup, then serve'},{key:'leave',label:'Put it on the pickup counter without checking'},{key:'look',label:'Serve it immediately if the color looks right'}];instruction='Check that the finished drink matches the order.';guide='Check the drink, temperature, size, special requests and order number against the ticket. Check that the lid is secure and the cup is clean and not leaking.'}
 if(session.stage==='order'||session.stage==='handoff'){const key=session.index+'|'+session.stage;if(session.optionsKey!==key){session.optionsKey=key;session.stageOrder=shuffle(options.map(o=>o.key))}options=session.stageOrder.map(key=>options.find(o=>o.key===key)).filter(Boolean);write(SESSION,session)}
 $('#practice-view').innerHTML=`${title('DRINK PRACTICE','Drink practice',`${session.mode==='guided'?'Guided practice':'Solo practice'} · ${session.index+1} / ${session.queue.length} orders · Auto-saved`)}<div class="practice-grid"><aside class="ticket"><div class="ticket-top"><span>Order ticket</span><span>#${String(session.index+1).padStart(2,'0')}</span></div><h2>${E(r.name)}</h2><span class="ticket-tag">${r.cup==='hot'?'Hot':r.cup==='blended'?'Blended':'Cold'}</span><div style="margin-top:10px">${badge(r)}</div><div class="ticket-detail"><dl><div><dt>Cup size</dt><dd>${E(r.size||'Check your café’s cup size')}</dd></div><div><dt>Quantity / Special requests</dt><dd>1 drink / None</dd></div></dl>${r.notes?`<p style="margin:12px 0 0">${E(r.notes).replace(/\n/g,'<br>')}</p>`:''}</div><div class="actions"><button class="quiet" data-go="home">Pause</button></div></aside><div class="workbench"><div class="station-rail" aria-label="Drink-making sequence">${stages.map((v,i)=>`<span class="${i===stageIndex?'current':i<stageIndex?'done':''}">${i+1}. ${{order:'Order',cup:'Cup',amount:'Measure',steps:'Prepare',handoff:'Serve'}[v]}</span>`).join('')}</div><h2 id="stage-title" tabindex="-1">${titles[session.stage]}</h2><p class="instruction">${E(instruction)}</p>${session.mode==='guided'?`<div class="guided"><strong>Recipe guide</strong><br>${E(guide)}</div>`:''}${session.stage==='steps'&&session.step>0?`<div class="sequence" aria-label="Completed preparation steps">${r.steps.slice(0,session.step).map((s,i)=>`<span>${i+1}. ${E(s)}</span>`).join('')}</div>`:''}${['steps','handoff'].includes(session.stage)?drinkStation(session.stage==='steps'?options:[],session.stage==='handoff'):''}${session.stage!=='steps'?`<div class="choice-grid">${options.map((o,i)=>`<button class="choice ${session.wrong===o.key?'wrong':''} ${o.disabled?'selected':''}" data-answer="${E(o.key)}" ${o.disabled?'disabled':''}><span class="choice-no">Choice ${i+1}</span>${E(o.label)}</button>`).join('')}</div>`:' function wrongAnswer(key,expected,why){session.mistakes++;session.roundMistakes++;session.wrong=key;session.feedback=why;session.feedbackType='error';const signature=session.index+'|'+current().id+'|'+session.stage+'|'+(session.stage==='steps'?session.step:session.stage==='amount'?session.amountIndex:'');if(!session.logs.some(v=>v.signature===signature))session.logs.push({signature,round:session.index,recipeId:current().id,name:current().name,stage:session.stage,expected,why});renderPractice();$('#game-feedback')?.scrollIntoView({block:'nearest'})}
function choose(key){if(!session||['result','summary'].includes(session.stage))return;const r=current();

 if(session.stage==='order'){if(key!=='confirm')return wrongAnswer(key,'Recheck the order details','Clarify an ambiguous order before preparation. Guessing the temperature, size, extras or quantity can lead to remakes.');enterStage('cup')}
 else if(session.stage==='cup'){if(key!==r.cup)return wrongAnswer(key,cups[r.cup],`This cup does not match the drink’s temperature. ${r.cup==='hot'?'For hot drinks, use the heat-safe cups specified by your café.':r.cup==='blended'?'Check which cup your café uses for blended drinks.':'Check which cup to use for cold drinks.'}`);enterStage(r.ingredients.length?'amount':'steps')}
 else if(session.stage==='amount'){const item=r.ingredients[session.amountIndex];if(Number(key)!==item.amount)return wrongAnswer(key,`${item.name} ${item.amount} ${item.unit}`,'This does not match the recipe quantity. Remember both the amount and unit.');session.amountIndex++;if(session.amountIndex<r.ingredients.length){session.amountChoices=amountChoices(r.ingredients[session.amountIndex]);session.wrong=null;session.feedback='The quantity is correct. Check the next ingredient.';session.feedbackType='success'}else enterStage('steps')}
 else if(session.stage==='steps'){const item=session.choices.find(v=>v.key===key);if(!item||ensureDrink().spoiled||item.index>=0&&item.index<session.step)return;applyDrinkStep(item);if(item.index!==session.step){session.drink.spoiled=true;return wrongAnswer(key,r.steps[session.step],'A step was applied out of order. Empty the cup and start from the beginning of the recipe.')}session.step++;session.wrong=null;session.feedback='Correct. Move to the next step.';session.feedbackType='success';if(session.step===r.steps.length)enterStage('handoff')}
 else if(session.stage==='handoff'){if(key!=='check')return wrongAnswer(key,'Check the drink against the order and check the cup','Check the finished drink against the order. Confirm the drink, temperature, size and special requests, and check the cup before serving.');session.stage='result';session.scores.push(Math.max(0,100-session.roundMistakes*12))}

function renderSummary(){const score=Math.round(session.scores.reduce((a,b)=>a+b,0)/session.scores.length),missed=new Set(session.logs.map(v=>v.recipeId));$('#practice-view').innerHTML=`<div class="result"><span class="eyebrow">PRACTICE COMPLETE</span><h1 tabindex="-1" style="font-size:34px">${session.queue.length} drinks completed</h1><div class="result-score">${score}<small style="font-size:20px"> points</small></div><p>${session.mode==='guided'?'You earned this score with step-by-step guidance. Try Solo practice next to see what you remember.':'You earned this score without hints. Have your trainer check your hands-on drink preparation.'}</p><div class="summary-grid"><div><strong>${session.queue.length} drink</strong><span>Done</span></div><div><strong>${session.mistakes} sessions</strong><span>Mistakes</span></div><div><strong>${missed.size} items</strong><span>Drinks to review</span></div></div>${session.logs.length?`<div class="review-list"><h2 style="font-size:21px">What to review</h2>${session.logs.map(v=>`<div class="review-item"><strong>${E(v.name)}</strong><p>${E(v.expected)}</p>${E(v.why)}</div>`).join('')}</div>`:'<p>You completed this session without mistakes.</p>'}<div class="actions">${missed.size?'<button class="primary" id="retry-missed">Retry missed drinks only</button>':'<button class="primary" id="solo-again">Try these drinks solo</button>'}<button class="secondary" data-go="home">Choose other drinks</button><button class="quiet" id="print-result">Print results</button></div><p class="small" style="margin:24px 0 0">Scoring: each drink starts at 100 points. Each mistake deducts 12 points. The final score is the average.</p></div>`}
function startQuiz(ids){const selectedQuestions=ids?questions.filter(q=>ids.includes(q.id)):questions;quiz={queue:shuffle(selectedQuestions),index:0,answers:[],chosen:null};renderBasics()}
function renderBasics(){
 const header=title('FIRST SHIFT BASICS','First-day basics','Practice making decisions you will need at the café before you start making drinks.');
 let question;
 if(!quiz){question=`<div class="panel question-card"><span class="eyebrow">9 EVERYDAY SITUATIONS</span><h2>When you are unsure, ask.</h2><p>Practice short scenarios about orders, hand and tool hygiene, allergies, milk and equipment care, and mistakes. Each answer includes an explanation.</p><div class="actions"><button class="primary" id="start-basics">9 scenarios to practice</button>${basicRecord.missed.length?'<button class="secondary" id="retry-basics">Review missed scenarios</button>':''}</div><p class="small" style="margin-top:22px">This game helps you practice making decisions. Learn handwashing, measuring, pulling espresso and steaming milk in person at your café.</p></div>`}
 else if(quiz.index>=quiz.queue.length){const correct=quiz.answers.filter(v=>v.correct).length;question=`<div class="panel question-card"><span class="eyebrow">BASICS COMPLETE</span><h2>You have finished the scenarios</h2><div class="result-score">${correct} / ${quiz.queue.length}</div><p>These results use your first answer for each scenario. Reread the explanations for missed scenarios and try again.</p>${quiz.answers.filter(v=>!v.correct).map(v=>{const q=questions.find(q=>q.id===v.id);return `<div class="review-item"><strong>${E(q.topic)}</strong>${E(q.why)}</div>`}).join('')}<div class="actions"><button class="primary" data-go="home">Go to drink practice</button>${quiz.answers.some(v=>!v.correct)?'<button class="secondary" id="retry-current-basics">Review the scenarios you missed</button>':''}<button class="quiet" id="start-basics">Try all scenarios again</button></div></div>`}
 else{const q=quiz.queue[quiz.index],answered=quiz.chosen!==null,isCorrect=quiz.chosen===q.correct;question=`<div class="panel question-card"><div class="setup-head"><span class="tag">${E(q.topic)}</span><span class="small">${quiz.index+1} / ${quiz.queue.length}</span></div><h2>${E(q.title)}</h2><div class="choice-grid">${q.answers.map((a,i)=>`<button class="choice ${answered&&i===q.correct?'selected':''} ${answered&&i===quiz.chosen&&!isCorrect?'wrong':''}" data-basic-answer="${i}" ${answered?'disabled':''}>${E(a)}</button>`).join('')}</div>${answered?`<div class="answer-explanation ${isCorrect?'':'incorrect'}" role="status"><strong>${isCorrect?'Correct.':'Here is what to consider.'}</strong><br>${E(q.why)}${!isCorrect?`<br><strong>Recommended action: ${E(q.answers[q.correct])}</strong>`:''}</div><div class="actions"><button class="primary" id="next-basic">${quiz.index===quiz.queue.length-1?'View results':'Next scenario'}</button></div>`:'<p class="small">Choose the most appropriate action.</p>'}</div>`}
 $('#basics-view').innerHTML=header+`<div class="foundation-layout"><div>${question}<div class="sources">Training references: <a href="https://education.sca.coffee/coffee-skills-program" target="_blank" rel="noopener">SCA Barista education</a> · <a href="https://www.food.gov.uk/business-guidance/allergen-guidance-for-food-businesses" target="_blank" rel="noopener">FSA Allergen management</a><br>These scenarios draw on general training principles. Check locally required training and café procedures with your trainer.</div></div><aside class="panel"><div class="setup-head"><h2>On-site checks</h2><span class="tag" id="check-count">${checks.length} / ${checklist.length}</span></div><p>Check off only the skills you have learned in person. On a shared device, clear the checklist before a new trainee starts.</p><div class="checklist">${checklist.map(([name,detail],i)=>`<label class="check-item"><input type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span><strong>${E(name)}</strong><small>${E(detail)}</small></span></label>`).join('')}</div><div class="actions"><button class="quiet" id="print-checklist">Print checklist</button><button class="quiet" id="clear-checklist">Clear checklist</button></div></aside></div>`;
}
function answerBasic(index){if(!quiz||quiz.chosen!==null||quiz.index>=quiz.queue.length)return;const q=quiz.queue[quiz.index],correct=index===q.correct;quiz.chosen=index;quiz.answers.push({id:q.id,correct});if(!basicRecord.seen.includes(q.id)){basicRecord.seen.push(q.id);if(correct)basicRecord.firstCorrect.push(q.id)}basicRecord.missed=basicRecord.missed.filter(v=>v!==q.id);if(!correct)basicRecord.missed.push(q.id);write(BASIC,basicRecord);renderBasics();$('#next-basic')?.focus({preventScroll:true})}
function amountTable(r){return r.ingredients.length?`<table class="amount-table"><caption style="text-align:left;font-weight:800">Recipe quantities</caption><tbody>${r.ingredients.map(v=>`<tr><td>${E(v.name)}</td><td>${v.amount} ${E(v.unit)}</td></tr>`).join('')}</tbody></table>`:'<div class="inline-note">No ingredient quantities have been entered. Add them in Café settings to include measurement questions in the practice.</div>'}
function recipeDetail(r){return `<div class="detail-grid recipe-details" id="recipe-detail"><div class="panel"><span class="eyebrow">RECIPE STANDARD</span><h2 style="margin-top:10px">${E(r.name)}</h2>${badge(r)}<p style="margin-top:15px">Cup: ${E(cups[r.cup])}<br>Size: ${E(r.size||'Check your café’s cup size')}</p>${amountTable(r)}${r.notes?`<div class="guided"><strong>Café notes</strong><br>${E(r.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="actions"><button class="primary" data-practice-recipe="${E(r.id)}">Practice this drink (3 orders)</button><button class="quiet" id="edit-selected">Edit recipe</button></div></div><div class="panel"><h2>Preparation steps</h2><ol class="recipe-steps">${r.steps.map(v=>`<li>${E(v)}</li>`).join('')}</ol><div class="inline-note">Check the order → Make the drink → Check the drink against the order and inspect the cup</div></div></div>`}
function renderLibrary(){const r=recipes.find(r=>r.id===selected)||recipes[0];selected=r.id;$('#library-view').innerHTML=title('RECIPE NOTE','Recipe notes','Read your café’s recipes and start with the drinks you need to learn.')+`<div class="search-row"><input id="recipe-search" type="search" placeholder="Search drink names" aria-label="Search drink names"><button class="quiet" id="print-recipes">Print recipes</button></div><div class="recipe-grid" id="recipe-grid">${recipes.map(v=>`<button class="recipe-card" data-recipe="${E(v.id)}" aria-pressed="${v.id===selected}"><div class="top"><span class="mini">${v.cup==='hot'?'HOT':v.cup==='blended'?'BLENDED':'ICED'}</span>${badge(v)}</div><h3>${E(v.name)}</h3><p>${v.steps.length} steps · ${E(v.size||'Size not entered')}</p></button>`).join('')}</div><p id="search-empty" class="menu-empty hidden">No matching drinks.</p>${recipeDetail(r)}`}
function quantityRow(v={name:'',amount:'',unit:'ml'},i=0){return `<div class="quantity-row"><input aria-label="Ingredient ${i+1} Name" data-q-name maxlength="30" placeholder="e.g. milk" value="${E(v.name)}"><input aria-label="Ingredient ${i+1} Amount" data-q-amount type="number" min="0.01" max="10000" step="any" placeholder="Amount" value="${E(v.amount)}"><select aria-label="Ingredient ${i+1} Unit" data-q-unit>${['ml','g','shots','pumps','pieces'].map(unit=>`<option ${unit===v.unit?'selected':''}>${unit}</option>`).join('')}</select><button type="button" data-remove-quantity aria-label="Ingredient ${i+1} Delete">Delete</button></div>`}
function renderSettings(){const r=recipes.find(r=>r.id===editing);$('#settings-view').innerHTML=title('STORE SETUP','Café settings','Replacing examples with café standards makes training more accurate.')+`<div class="notice"><strong>How to set up</strong> · Choose a drink → Enter the cup size and quantities → Review the steps → Confirm the recipe has been checked → Save<br>Standards vary with beans, equipment and cup sizes. Add extraction yield and time, steaming standards and other details to Café notes.</div><div class="detail-grid"><div class="panel"><h2>Menu ${recipes.length} items</h2><div class="settings-list">${recipes.map(v=>`<button class="navbtn ${v.id===editing?'active':''}" data-edit="${E(v.id)}">${E(v.name)}<br><small style="font-weight:500">${v.confirmed?'Café verified':'Not verified'}</small></button>`).join('')}</div><div class="actions"><button class="secondary" id="new-recipe">Add a drink</button><button class="quiet" id="duplicate-recipe" ${r?'':'disabled'}>Duplicate selected drink</button></div></div><div class="panel"><h2>${r?'Edit recipe':'Add a drink'}</h2><form id="recipe-form"><div id="form-error" class="form-error hidden" role="alert"></div><div class="form-grid"><div class="field"><label for="recipe-name">Drink name</label><input id="recipe-name" maxlength="40" required value="${E(r?.name||'')}" placeholder="e.g. Iced Café Latte"></div><div class="field"><label for="recipe-cup">Cup type</label><select id="recipe-cup">${Object.entries(cups).map(([key,label])=>`<option value="${key}" ${key===(r?.cup||'cold')?'selected':''}>${E(label)}</option>`).join('')}</select></div></div><div class="field"><label for="recipe-size">Cup size / Serving size</label><input id="recipe-size" maxlength="30" value="${E(r?.size||'')}" placeholder="e.g. standard 16oz café cup"></div><div class="field"><label>Measured ingredients</label><span class="field-help">Enter the quantities from your café’s recipe. Leave this blank to skip measurement questions.</span><div class="quantity-labels"><span>Ingredient name</span><span>Amount</span><span>Unit</span><span></span></div><div id="quantity-rows">${(r?.ingredients||[]).map(quantityRow).join('')}</div><button type="button" class="quiet" id="add-quantity">Add an ingredient row</button></div><div class="field"><label for="recipe-steps">Preparation steps</label><textarea id="recipe-steps" required>${E(r?.steps.join('\n')||'')}</textarea><span class="field-help">One step per line, 2–12 steps. Use distinct names for similar steps.</span></div><div class="field"><label for="recipe-notes">Café notes / Quality standards</label><textarea id="recipe-notes" maxlength="600" style="min-height:100px" placeholder="Dose, extraction yield/time, steaming standards and locations of ingredient/allergen information">${E(r?.notes||'')}</textarea></div><label class="check-item"><input id="recipe-confirmed" type="checkbox" ${r?.confirmed?'checked':''}><span>The trainer checked this against the actual café recipe.</span></label><div class="actions"><button class="primary" type="submit">Save recipe</button><button class="danger" type="button" id="delete-recipe" ${!r||recipes.length===1?'disabled':''}>Delete drink</button></div></form></div></div><div class="panel" style="margin-top:17px"><h2>Back up and restore</h2><p>Your data is saved in this browser only. Export a JSON backup before clearing browser data or moving the file. The backup includes recipes only.</p><div class="settings-actions"><button class="quiet" id="export-recipes">Export JSON</button><button class="quiet" id="import-trigger">Import JSON</button><button class="quiet" id="undo-recipes" ${recipeBackup?'':'disabled'}>Undo previous change</button><button class="danger" id="reset-recipes">Reset to examples</button><input type="file" id="import-file" accept=".json,application/json" class="hidden" aria-label="Choose recipe JSON"></div><div id="import-preview"></div></div>`;formDirty=false}
function commitRecipes(next,message){const validated=validate(next);recipeBackup=copy(recipes);write(BACKUP,recipeBackup);recipes=validated;const saved=write(STORAGE,recipes);editing=recipes.some(r=>r.id===editing)?editing:recipes[0].id;selected=editing;formDirty=false;renderSettings();showToast(saved?message:'Applied only to this screen. Browser storage is restricted; back up as JSON.')}
function saveForm(event){event.preventDefault();try{const ingredients=[...document.querySelectorAll('.quantity-row')].map(row=>({name:row.querySelector('[data-q-name]').value,amount:row.querySelector('[data-q-amount]').value,unit:row.querySelector('[data-q-unit]').value}));const draft={id:editing||uid(),name:$('#recipe-name').value,cup:$('#recipe-cup').value,size:$('#recipe-size').value,steps:$('#recipe-steps').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean),ingredients,notes:$('#recipe-notes').value,confirmed:$('#recipe-confirmed').checked};const next=copy(recipes),index=next.findIndex(r=>r.id===editing);if(index>=0)next[index]=draft;else next.push(draft);validate(next);editing=draft.id;commitRecipes(next,'Recipe saved.')}catch(error){const node=$('#form-error');node.textContent=error.message;node.classList.remove('hidden');node.scrollIntoView({block:'center'})}}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}

// Included inline by localize-cafe-game.py; no network or runtime dependencies.
const cafeSharedStorage='cafe-first-day-bilingual-v1';
const cafeReverseTranslations=Object.fromEntries(Object.entries(cafeTranslations).map(([ko,en])=>[en,ko]));
const cafePhrasePatterns={};
function translateCafeText(value,from,to){
 if(typeof value!=='string'||from===to)return value;
 const dictionary=from==='ko'?cafeTranslations:cafeReverseTranslations;
 if(Object.hasOwn(dictionary,value))return dictionary[value];
 // Translate generated feedback phrases, without interpreting arbitrary short words.
 if(!cafePhrasePatterns[from])cafePhrasePatterns[from]=new RegExp(Object.keys(dictionary).filter(key=>key.length>6).sort((a,b)=>b.length-a.length).map(key=>key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
 return value.replace(cafePhrasePatterns[from],match=>dictionary[match]);
}
function cafeUnit(value,locale){
 const units=locale==='ko'?{shots:'샷',pumps:'펌프',pieces:'개'}:{샷:'shots',펌프:'pumps',개:'pieces'};
 return units[value]||value;
}
function transferCafeState(snapshot,locale,defaults,questions){
 const from=snapshot.locale;
 const original=snapshot.state;
 const clone=value=>JSON.parse(JSON.stringify(value));
 const words=value=>{
  if(typeof value==='string')return translateCafeText(value,from,locale);
  if(Array.isArray(value))return value.map(words);
  if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([key,item])=>[key,words(item)]));
  return value;
 };
 const recipe=value=>{
  const next=clone(value),before=snapshot.defaults.find(item=>item.id===value.id),after=defaults.find(item=>item.id===value.id);
  if(before&&after){
   if(next.name===before.name)next.name=after.name;
   next.steps=next.steps.map((step,index)=>step===before.steps[index]?after.steps[index]:step);
  }
  // Custom names, notes, ingredient names and steps are never auto-translated.
  next.ingredients=(next.ingredients||[]).map(item=>({...item,unit:cafeUnit(item.unit,locale)}));
  return next;
 };
 const next={...clone(original),recipes:original.recipes.map(recipe),recipeBackup:original.recipeBackup?.map(recipe)||null,pendingImport:original.pendingImport?.map(recipe)||null};
 if(original.session){
  next.session=words(original.session);
  next.session.queue=original.session.queue.map(recipe);
  const before=original.session.queue[original.session.index],after=next.session.queue[original.session.index];
  const stepLabel=label=>{const index=before.steps.indexOf(label);return index>=0?after.steps[index]:translateCafeText(label,from,locale)};
  if(next.session.choices)next.session.choices=original.session.choices.map(item=>({...item,label:item.index>=0?after.steps[item.index]:translateCafeText(item.label,from,locale)}));
  if(original.session.drink)next.session.drink={...clone(original.session.drink),actions:original.session.drink.actions.map(item=>({...item,label:stepLabel(item.label),name:translateCafeText(item.name,from,locale)}))};
  next.session.logs=original.session.logs.map(item=>{
   const sourceRecipe=original.session.queue.find(r=>r.id===item.recipeId),targetRecipe=next.session.queue.find(r=>r.id===item.recipeId);
   const index=sourceRecipe?.steps.indexOf(item.expected)??-1;
   return {...words(item),name:targetRecipe?.name||item.name,expected:index>=0?targetRecipe.steps[index]:translateCafeText(item.expected,from,locale)};
  });
 }
 if(original.quiz)next.quiz={...clone(original.quiz),queue:original.quiz.queue.map(item=>clone(questions.find(q=>q.id===item.id)||item))};
 const ui=snapshot.ui?clone(snapshot.ui):null;
 if(ui?.draft){
  const before=original.recipes.find(item=>item.id===original.editing),after=next.recipes.find(item=>item.id===original.editing);
  if(before&&after){
   if(ui.draft.name===before.name)ui.draft.name=after.name;
   ui.draft.steps=ui.draft.steps.split(/\r?\n/).map((step,index)=>step===before.steps[index]?after.steps[index]:step).join('\n');
  }
  ui.draft.ingredients=ui.draft.ingredients.map(item=>({...item,unit:cafeUnit(item.unit,locale)}));
 }
 return {state:next,ui};
}
function readCafeSnapshot(){
 try{
  const value=JSON.parse(localStorage.getItem(cafeSharedStorage));
  if(['ko','en'].includes(value?.locale)&&Array.isArray(value.defaults)&&Array.isArray(value.state?.recipes))return value;
 }catch{}
 return null;
}
let cafeLocale=cafeDefaultLocale,cafeGame,cafeController;
const cafeHash=new URLSearchParams(location.hash.slice(1)).get('lang');
if(['ko','en'].includes(cafeHash))cafeLocale=cafeHash;
function persistCafeState(){
 if(!cafeGame)return;
 try{localStorage.setItem(cafeSharedStorage,JSON.stringify(cafeGame.snapshot(false)))}catch{}
}
function mountCafeLanguage(locale,snapshot,switched=false){

 cafeLocale=locale;
 document.documentElement.lang=locale;
 document.title=cafeMetadata[locale].title;
 document.querySelector('meta[name="description"]').content=cafeMetadata[locale].description;

document.addEventListener('click',event=>{

})();

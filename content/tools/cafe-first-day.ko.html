one}.ice-piece{position:absolute;width:33px;height:31px;border:2px solid #f7ffffb0;background:linear-gradient(140deg,#efffffc9,#bde0ed50);border-radius:7px;box-shadow:inset 2px 2px 5px #ffffff90;animation:ice-drop .65s cubic-bezier(.2,.8,.3,1) both}.cup-lid{position:absolute;left:14px;right:14px;bottom:208px;border:3px solid #768b80;background:#e4e8dc;height:15px;border-radius:8px 8px 3px 3px;z-index:8}.pour-stream{position:absolute;left:91px;top:0;width:9px;height:185px;z-index:4;background:var(--pour-color);border-radius:9px;animation:pour .7s ease-out both;pointer-events:none}.cup-label{margin:16px 0 8px;font-weight:850;font-size:14px;text-align:center}.drink-status{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}.cup-contents{font-size:12px;line-height:1.6;max-width:190px;text-align:center;margin:6px 0;color:#465c4c}.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.shelf-head h3{margin:0;font-size:16px}.ingredient-shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ingredient-button{display:flex;align-items:center;gap:10px;text-align:left;min-height:77px;padding:12px;background:#fffdf8;border:1px solid #d9dfd1;border-radius:12px;color:var(--ink)}.ingredient-button:hover{border-color:var(--green);box-shadow:0 3px 9px #354e3312}.ingredient-button.selected{background:#e0e8d9}.ingredient-button.wrong{border-color:var(--red);background:#fff1eb}.ingredient-button strong{display:block;font-size:14px}.ingredient-button small{display:block;font-size:11px;line-height:1.5;margin-top:3px;color:var(--muted)}.ingredient-swatch{width:28px;height:39px;border:2px solid #87988b;border-radius:4px 4px 10px 10px;background:linear-gradient(transparent 25%,var(--ingredient-color) 25%);flex-shrink:0}.ingredient-swatch.tool{border-radius:6px;background:var(--ingredient-color);height:28px}.station-note{font-size:11px;color:var(--muted);line-height:1.7;margin:12px 0 0}.cup-reset{padding:7px 11px;min-height:36px;font-size:12px}.contaminated{border-color:#bc7566;background:#f5e5dc}.remake-alert{margin:12px 0 0;color:var(--red);font-size:13px;font-weight:700;line-height:1.6}.steam-cloud{position:absolute;top:5px;left:55px;font-size:12px;line-height:1.8;letter-spacing:8px;color:#6c7d6e;animation:steam 1.5s ease-in-out infinite}.station-idle{font-size:12px;letter-spacing:.1em;color:var(--muted);position:absolute;top:95px;left:0;right:0;text-align:center}.station-finished{display:block}.finished-drink{max-width:220px;margin:18px auto}.finished-drink .cup-zone{min-height:290px}.finished-drink .drink-station{display:block;padding:10px;border:0;margin:0}.finished-drink .ingredient-area,.finished-drink .cup-reset,.finished-drink .station-note{display:none}.workbench .drink-station + .choice-grid{margin-top:18px}
@keyframes liquid-in{from{transform:scaleY(.05);transform-origin:bottom;opacity:.4}to{transform:scaleY(1);transform-origin:bottom;opacity:1}}@keyframes ice-drop{from{translate:0 -130px;opacity:0}to{translate:0 0;opacity:1}}@keyframes pour{0%{opacity:0;transform:scaleY(0);transform-origin:top}20%,70%{opacity:1;transform:scaleY(1);transform-origin:top}100%{opacity:0;transform:scaleY(.4);transform-origin:bottom}}@keyframes steam{50%{translate:0 -6px;opacity:.5}}
@media(max-width:1100px){.drink-station{grid-template-columns:180px minmax(0,1fr);padding:15px;gap:12px}.ingredient-shelf{grid-template-columns:1fr}.cup-scene{width:170px}.pour-stream{left:81px}}
@media(max-width:650px){.drink-station{grid-template-columns:1fr;padding:15px}.cup-zone{min-height:295px}.ingredient-shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.ingredient-button{padding:10px;gap:7px}.ingredient-button strong{font-size:13px}.ingredient-button small{font-size:10px}.cup-scene{height:215px}.live-cup{height:180px;width:135px}.cup-lid{bottom:186px}.pour-stream{height:160px}.cup-label{margin-top:10px}}
@media(prefers-reduced-motion:reduce){.drink-liquid,.ice-piece,.pour-stream,.steam-cloud{animation:none}.pour-stream{display:none}}

<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), copy=v=>JSON.parse(JSON.stringify(v));
const STORAGE='cafe-first-day-recipes-v1', RECORD='cafe-first-day-record-v2', SESSION='cafe-first-day-session-v2', BACKUP='cafe-first-day-recipe-backup-v2', BASIC='cafe-first-day-basics-v2', CHECKS='cafe-first-day-checks-v2';
const cups={cold:'차가운 음료용 컵',hot:'따뜻한 음료용 컵',blended:'블렌디드 전용 컵'};
      const defaults = [
        {id:'iced-americano',name:'아이스 아메리카노',cup:'cold',steps:['컵에 얼음을 담는다','정수물을 붓는다','에스프레소를 추출한다','추출한 샷을 컵에 붓는다','뚜껑을 닫고 컵 외부를 정리한다']},
        {id:'hot-americano',name:'따뜻한 아메리카노',cup:'hot',steps:['따뜻한 컵을 준비한다','온수를 컵에 붓는다','에스프레소를 추출한다','추출한 샷을 컵에 붓는다','뚜껑을 닫고 컵 외부를 정리한다']},
        {id:'iced-latte',name:'아이스 카페라떼',cup:'cold',steps:['컵에 얼음을 담는다','차가운 우유를 붓는다','에스프레소를 추출한다','추출한 샷을 컵에 붓는다','뚜껑을 닫고 컵 외부를 정리한다']},
        {id:'hot-latte',name:'따뜻한 카페라떼',cup:'hot',steps:['따뜻한 컵을 준비한다','에스프레소를 추출한다','컵에 추출한 샷을 담는다','우유를 스팀한다','스팀 우유를 컵에 붓는다']},
        {id:'vanilla-latte',name:'아이스 바닐라라떼',cup:'cold',steps:['컵에 바닐라 시럽을 담는다','차가운 우유를 붓고 섞는다','컵에 얼음을 담는다','에스프레소를 추출한다','추출한 샷을 컵에 붓는다']},
        {id:'peach-tea',name:'복숭아 아이스티',cup:'cold',steps:['컵에 아이스티 베이스를 담는다','물을 붓고 충분히 섞는다','컵에 얼음을 담는다','뚜껑을 닫고 컵 외부를 정리한다']}
      ];

const questions=[
{id:'order',topic:'주문 확인',title:'손님이 “라떼 하나 주세요”라고만 말했어요. 먼저 어떻게 할까요?',answers:['음료의 온도·크기·추가 요청·수량을 확인하고 주문을 다시 읽어 준다','자주 팔리는 크기로 바로 만든다','옆 테이블 음료와 똑같이 만든다'],correct:0,why:'추측하지 않고 주문을 구체적으로 확인하세요. “아이스, 기본 크기, 추가 없이 한 잔 맞으실까요?”처럼 다시 읽으면 제조 전 오류를 줄일 수 있어요.'},
{id:'hands',topic:'손 위생',title:'결제를 돕느라 돈과 휴대전화를 만졌어요. 다시 음료를 만들기 전에?',answers:['앞치마에 손을 닦는다','손을 씻고 매장 위생 절차에 따라 작업을 재개한다','컵을 잡을 때만 조심한다'],correct:1,why:'돈과 휴대전화 등을 만진 뒤에는 식품 취급 전에 손을 씻으세요. 장갑도 손 씻기를 대신하지 않습니다. 매장 절차에 따라 오염된 장갑이나 도구도 교체하세요.'},
{id:'ice',topic:'도구 구분',title:'얼음을 컵에 담아야 해요. 어떤 방법을 사용할까요?',answers:['음료 컵을 얼음통 안에 넣어 뜬다','손으로 빠르게 담는다','얼음 전용 스쿱으로 담고, 손잡이가 얼음에 닿지 않게 지정 위치에 둔다'],correct:2,why:'얼음은 음료에 들어가는 식품입니다. 전용 도구를 사용하고 손, 컵 가장자리, 오염된 손잡이가 얼음에 닿지 않게 관리하세요.'},
{id:'allergy',topic:'알레르기 요청',title:'손님이 우유 알레르기가 있다며 식물성 음료로 바꾸면 안전한지 물어요.',answers:['우유만 빼면 무조건 안전하다고 안내한다','성분표와 도구 공유 여부를 확인하고 담당자와 매장 절차에 따라 안내한다','식물성 음료라는 이름만 확인한다'],correct:1,why:'대체 음료에도 다른 알레르기 유발 성분이 있을 수 있고, 공유 피처·스팀봉 등을 통한 교차접촉도 고려해야 합니다. 성분이나 제조 환경이 불확실하면 안전을 약속하지 말고 담당자에게 확인하세요.'},
{id:'steam',topic:'스팀봉 관리',title:'우유를 스팀한 직후 스팀봉은 어떻게 관리할까요?',answers:['다음 주문이 올 때까지 그대로 둔다','작업대 행주로 한 번 닦는다','화상에 주의하며 전용 청결 천과 장비·매장 절차에 따라 닦고 퍼지한다'],correct:2,why:'우유 잔여물이 마르기 전에 스팀봉을 관리합니다. 작업대용 천과 구분하고, 뜨거운 봉과 증기에 주의하세요. 퍼지와 세척은 장비 제조사 및 매장 절차에 따라 배우세요.'},
{id:'milk',topic:'우유 취급',title:'피처에 남은 스팀 우유를 새 우유와 섞어서 다시 데워도 될까요?',answers:['남은 우유를 재사용하지 않고 매장 절차에 따라 처리한 뒤 신선한 우유로 만든다','우유를 더 넣어 양만 맞춘다','차가운 컵으로 옮겼다가 다시 스팀한다'],correct:0,why:'스팀한 우유를 반복해서 데우거나 새 우유에 섞어 쓰지 마세요. 필요한 양을 먼저 계량하고 남은 우유는 매장 식품 안전 절차에 따라 처리하세요.'},
{id:'shot',topic:'추출 기준',title:'추출 결과가 매장 레시피의 기준과 달라요. 신입이라 원인을 모르겠어요.',answers:['우유를 많이 넣어 맛을 가린다','사용을 멈추고 기준과 측정값을 확인한 뒤 교육 담당자에게 도움을 요청한다','그라인더를 임의로 크게 바꾼다'],correct:1,why:'원두 투입량, 추출량, 시간 등 매장이 정한 기준을 확인하세요. 기준에서 벗어난 샷을 그대로 제공하지 않고 담당자와 원인을 확인합니다. 수치는 장비와 원두에 따라 달라집니다.'},
{id:'handoff',topic:'제공 전 확인',title:'음료가 완성됐어요. 손님에게 드리기 전에 확인할 것은?',answers:['색깔만 보고 바로 제공한다','대기 시간이 길었는지만 확인한다','주문 음료·온도·크기·요청 사항·주문번호와 컵 상태를 확인한다'],correct:2,why:'제조가 끝나도 확인은 남아 있습니다. 주문표와 완성 음료를 대조하고 뚜껑, 컵 외부, 누수 등을 확인한 뒤 주문번호나 음료명을 안내하세요.'},
{id:'mistake',topic:'실수 대응',title:'아이스로 주문했는데 따뜻한 음료를 만들었어요. 어떻게 할까요?',answers:['실수를 알리고 매장 절차에 따라 정확한 주문으로 다시 제조한다','얼음만 넣어 바로 제공한다','손님이 말할 때까지 기다린다'],correct:0,why:'잘못 만든 음료를 임의로 수정해 제공하지 말고 담당자에게 알리세요. 매장의 재제조 및 고객 응대 절차에 따라 정확한 주문으로 다시 만듭니다.'}
];
const checklist=[['주문과 메뉴','온도, 크기, 옵션, 수량, 주문번호를 다시 확인할 수 있다.'],['손과 도구 위생','손 씻는 시점, 얼음 스쿱, 행주 구분과 보관 위치를 안다.'],['재료와 보관','원재료 성분표, 개봉 표시, 냉장 보관 기준과 재료 위치를 확인했다.'],['장비와 화상 예방','머신·그라인더·스팀봉의 안전 사용법을 담당자에게 배웠다.'],['매장 레시피','컵 크기, 계량, 추출 및 스팀 기준을 실제 도구로 확인했다.'],['알레르기 요청','담당자에게 알리는 방법과 성분·도구 공유 확인 절차를 안다.'],['제공과 정리','완성 음료 대조, 고객 안내, 도구 세척·정리 절차를 수행했다.'],['실제 한 잔 제조','교육 담당자가 지켜보는 가운데 한 잔을 만들고 피드백을 받았다.']];
function read(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):copy(fallback)}catch{return copy(fallback)}}
let storageOk=true;
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{storageOk=false;showToast('브라우저 저장이 제한되어 있습니다. 레시피는 JSON으로 백업하세요.');return false}}
const uid=()=> 'recipe-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
function normalizeRecipe(item,ids){
 if(!item||typeof item!=='object')throw Error('레시피 형식이 올바르지 않습니다.');
 const id=String(item.id||uid()),name=String(item.name||'').trim(),cup=item.cup;
 if(!id||id.length>100||ids.has(id))throw Error('음료 ID가 중복되었거나 올바르지 않습니다.');
 if(!name||name.length>40)throw Error('음료 이름은 1~40자로 입력하세요.');
 if(!Object.hasOwn(cups,cup))throw Error('컵 종류를 확인하세요.');

function renderLibrary(){const r=recipes.find(r=>r.id===selected)||recipes[0];selected=r.id;$('#library-view').innerHTML=title('RECIPE NOTE','레시피 노트','매장 기준을 읽고, 필요한 음료부터 익혀요.')+`<div class="search-row"><input id="recipe-search" type="search" placeholder="음료 이름 검색" aria-label="음료 이름 검색"><button class="quiet" id="print-recipes">레시피 인쇄</button></div><div class="recipe-grid" id="recipe-grid">${recipes.map(v=>`<button class="recipe-card" data-recipe="${E(v.id)}" aria-pressed="${v.id===selected}"><div class="top"><span class="mini">${v.cup==='hot'?'HOT':v.cup==='blended'?'BLENDED':'ICED'}</span>${badge(v)}</div><h3>${E(v.name)}</h3><p>${v.steps.length}단계 · ${E(v.size||'크기 미입력')}</p></button>`).join('')}</div><p id="search-empty" class="menu-empty hidden">일치하는 음료가 없습니다.</p>${recipeDetail(r)}`}
function quantityRow(v={name:'',amount:'',unit:'ml'},i=0){return `<div class="quantity-row"><input aria-label="재료 ${i+1} 이름" data-q-name maxlength="30" placeholder="예: 우유" value="${E(v.name)}"><input aria-label="재료 ${i+1} 양" data-q-amount type="number" min="0.01" max="10000" step="any" placeholder="양" value="${E(v.amount)}"><select aria-label="재료 ${i+1} 단위" data-q-unit>${['ml','g','샷','펌프','개'].map(unit=>`<option ${unit===v.unit?'selected':''}>${unit}</option>`).join('')}</select><button type="button" data-remove-quantity aria-label="재료 ${i+1} 삭제">삭제</button></div>`}
function renderSettings(){const r=recipes.find(r=>r.id===editing);$('#settings-view').innerHTML=title('STORE SETUP','매장 설정','예시를 매장 기준으로 바꾸면 교육이 더 정확해져요.')+`<div class="notice"><strong>설정 순서</strong> · 음료 선택 → 컵 크기와 계량 입력 → 제조 순서 확인 → 매장 확인 체크 → 저장<br>원두, 장비, 컵 크기에 따라 기준이 달라집니다. 추출량·시간과 우유 스팀 기준 등은 매장 메모에 적으세요.</div><div class="detail-grid"><div class="panel"><h2>메뉴 ${recipes.length}개</h2><div class="settings-list">${recipes.map(v=>`<button class="navbtn ${v.id===editing?'active':''}" data-edit="${E(v.id)}">${E(v.name)}<br><small style="font-weight:500">${v.confirmed?'매장 확인됨':'확인 전'}</small></button>`).join('')}</div><div class="actions"><button class="secondary" id="new-recipe">새 음료 추가</button><button class="quiet" id="duplicate-recipe" ${r?'':'disabled'}>선택 음료 복제</button></div></div><div class="panel"><h2>${r?'레시피 편집':'새 음료 추가'}</h2><form id="recipe-form"><div id="form-error" class="form-error hidden" role="alert"></div><div class="form-grid"><div class="field"><label for="recipe-name">음료 이름</label><input id="recipe-name" maxlength="40" required value="${E(r?.name||'')}" placeholder="예: 아이스 카페라떼"></div><div class="field"><label for="recipe-cup">컵 종류</label><select id="recipe-cup">${Object.entries(cups).map(([key,label])=>`<option value="${key}" ${key===(r?.cup||'cold')?'selected':''}>${E(label)}</option>`).join('')}</select></div></div><div class="field"><label for="recipe-size">컵 크기 / 제공 규격</label><input id="recipe-size" maxlength="30" value="${E(r?.size||'')}" placeholder="예: 매장 기본 16oz 컵"></div><div class="field"><label>계량할 재료</label><span class="field-help">실제 매장 값을 입력하세요. 비워 두면 계량 문제를 출제하지 않습니다.</span><div class="quantity-labels"><span>재료 이름</span><span>양</span><span>단위</span><span></span></div><div id="quantity-rows">${(r?.ingredients||[]).map(quantityRow).join('')}</div><button type="button" class="quiet" id="add-quantity">재료 한 줄 추가</button></div><div class="field"><label for="recipe-steps">제조 순서</label><textarea id="recipe-steps" required>${E(r?.steps.join('\n')||'')}</textarea><span class="field-help">한 줄에 한 단계씩 2~12단계. 겹치는 단계는 이름을 구분해 주세요.</span></div><div class="field"><label for="recipe-notes">매장 메모 / 품질 기준</label><textarea id="recipe-notes" maxlength="600" style="min-height:100px" placeholder="원두 투입량, 추출량·시간, 스팀 기준, 성분·알레르기 확인 위치 등">${E(r?.notes||'')}</textarea></div><label class="check-item"><input id="recipe-confirmed" type="checkbox" ${r?.confirmed?'checked':''}><span>교육 담당자가 실제 매장 레시피와 대조했습니다.</span></label><div class="actions"><button class="primary" type="submit">레시피 저장</button><button class="danger" type="button" id="delete-recipe" ${!r||recipes.length===1?'disabled':''}>음료 삭제</button></div></form></div></div><div class="panel" style="margin-top:17px"><h2>백업과 복원</h2><p>저장은 이 브라우저에만 남습니다. 브라우저 데이터 삭제나 파일 이동 전 JSON으로 백업하세요. JSON에는 레시피만 포함됩니다.</p><div class="settings-actions"><button class="quiet" id="export-recipes">JSON 내보내기</button><button class="quiet" id="import-trigger">JSON 불러오기</button><button class="quiet" id="undo-recipes" ${recipeBackup?'':'disabled'}>직전 변경 되돌리기</button><button class="danger" id="reset-recipes">예시로 초기화</button><input type="file" id="import-file" accept=".json,application/json" class="hidden" aria-label="레시피 JSON 선택"></div><div id="import-preview"></div></div>`;formDirty=false}
function commitRecipes(next,message){const validated=validate(next);recipeBackup=copy(recipes);write(BACKUP,recipeBackup);recipes=validated;const saved=write(STORAGE,recipes);editing=recipes.some(r=>r.id===editing)?editing:recipes[0].id;selected=editing;formDirty=false;renderSettings();showToast(saved?message:'현재 화면에만 적용했습니다. 브라우저 저장이 제한되어 JSON으로 백업해야 합니다.')}
function saveForm(event){event.preventDefault();try{const ingredients=[...document.querySelectorAll('.quantity-row')].map(row=>({name:row.querySelector('[data-q-name]').value,amount:row.querySelector('[data-q-amount]').value,unit:row.querySelector('[data-q-unit]').value}));const draft={id:editing||uid(),name:$('#recipe-name').value,cup:$('#recipe-cup').value,size:$('#recipe-size').value,steps:$('#recipe-steps').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean),ingredients,notes:$('#recipe-notes').value,confirmed:$('#recipe-confirmed').checked};const next=copy(recipes),index=next.findIndex(r=>r.id===editing);if(index>=0)next[index]=draft;else next.push(draft);validate(next);editing=draft.id;commitRecipes(next,'레시피를 저장했습니다.')}catch(error){const node=$('#form-error');node.textContent=error.message;node.classList.remove('hidden');node.scrollIntoView({block:'center'})}}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importFile(file){if(!file)return;try{if(file.size>500000)throw Error('500KB 이하 JSON 파일을 선택하세요.');pendingImport=validate(JSON.parse(await file.text()));$('#import-preview').innerHTML=`<div class="inline-note"><strong>${pendingImport.length}개 레시피를 읽었습니다.</strong><p>${pendingImport.map(r=>E(r.name)).join(' · ')}</p><p>적용하면 현재 레시피를 교체합니다. 직전 변경 되돌리기로 복원할 수 있습니다.</p><button class="primary" id="apply-import">이 레시피로 교체</button> <button class="quiet" id="cancel-import">취소</button></div>`}catch(error){showToast('불러오기 실패: '+error.message)}}
function printContent(html){$('#print-area').innerHTML='<div class="print-page">'+html+'</div>';window.print()}
function printRecipes(){printContent('<h1>카페 첫날 · 매장 레시피</h1><p>제조 전 주문 확인, 제조 후 주문 대조와 컵 상태 확인</p>'+recipes.map(r=>`<article class="print-recipe"><h2>${E(r.name)}</h2><p>${r.confirmed?'매장 확인됨':'예시 / 매장 확인 필요'} · ${E(cups[r.cup])} · ${E(r.size||'크기 확인 필요')}</p>${amountTable(r)}<ol>${r.steps.map(v=>`<li>${E(v)}</li>`).join('')}</ol>${r.notes?`<p>${E(r.notes).replace(/\n/g,'<br>')}</p>`:''}</article>`).join(''))}
document.addEventListener('submit',e=>{if(e.target.id==='recipe-form')saveForm(e)});
document.addEventListener('input',e=>{if(e.target.closest('#recipe-form'))formDirty=true;if(e.target.id==='recipe-search'){const term=e.target.value.trim().toLowerCase();let visible=0;document.querySelectorAll('[data-recipe]').forEach(b=>{const matches=b.textContent.toLowerCase().includes(term);b.classList.toggle('hidden',!matches);if(matches)visible++});$('#search-empty').classList.toggle('hidden',visible>0)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){const i=Number(e.target.dataset.check);checks=checks.filter(v=>v!==i);if(e.target.checked)checks.push(i);write(CHECKS,checks);$('#check-count').textContent=checks.length+' / '+checklist.length}if(e.target.id==='import-file'){importFile(e.target.files[0]);e.target.value=''}if(e.target.closest('#recipe-form'))formDirty=true});
window.addEventListener('beforeunload',e=>{if(formDirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('click',e=>{
 const target=e.target.closest('button,a');if(!target)return;
 const go=target.dataset.view||target.dataset.go;if(go){setView(go);return}
 if(target.id==='brand'){e.preventDefault();setView('home');return}
 if(target.id==='to-setup'||target.id==='path-practice'){$('#practice-setup').scrollIntoView({behavior:'smooth'});$('#start-home').focus({preventScroll:true});return}
 if(target.id==='start-home'){const list=[...document.querySelectorAll('[name=practice-menu]:checked')].map(v=>recipes.find(r=>r.id===v.value));startSession(list,Number($('#order-count').value),$('[name=mode]:checked').value);return}
 if(target.id==='toggle-menus'){const all=[...document.querySelectorAll('[name=practice-menu]')],next=all.some(v=>!v.checked);all.forEach(v=>v.checked=next);return}
 if(target.hasAttribute('data-answer')){choose(target.dataset.answer);return}
 if(target.id==='reset-drink'&&session?.stage==='steps'){drinkAnimation=null;enterStage('steps');session.feedback='컵을 비웠어요. 첫 제조 단계부터 다시 시작하세요. 실수 기록은 유지됩니다.';renderPractice();return}
 if(target.id==='next-order'){nextOrder();return}
 if(target.id==='hint-step'&&session?.stage==='steps'){session.hints++;session.roundHints++;session.feedback='다음 단계: '+current().steps[session.step];session.feedbackType='neutral';renderPractice();return}
 if(target.id==='retry-missed'){const missed=new Set(session.logs.map(v=>v.recipeId)),list=session.queue.filter((r,i,a)=>missed.has(r.id)&&a.findIndex(v=>v.id===r.id)===i);startSession(list,list.length,'solo',true);return}
 if(target.id==='solo-again'){const list=session.queue.filter((r,i,a)=>a.findIndex(v=>v.id===r.id)===i);startSession(list,session.queue.length,'solo');return}
 if(target.id==='start-basics'){startQuiz();return}
 if(target.id==='retry-basics'){startQuiz(basicRecord.missed);return}
 if(target.id==='retry-current-basics'){startQuiz(quiz.answers.filter(v=>!v.correct).map(v=>v.id));return}
 if(target.hasAttribute('data-basic-answer')){answerBasic(Number(target.dataset.basicAnswer));return}
 if(target.id==='next-basic'){if(quiz&&quiz.chosen!==null){quiz.index++;quiz.chosen=null;renderBasics();$('#basics-view h1')?.focus({preventScroll:true})}return}
 if(target.id==='clear-checklist'){checks=[];write(CHECKS,checks);renderBasics();showToast('현장 체크를 지웠습니다.');return}
 if(target.id==='clear-record'){$('#record-reset-panel').classList.remove('hidden');$('#confirm-clear-record').focus();return}
 if(target.id==='cancel-clear-record'){$('#record-reset-panel').classList.add('hidden');return}
 if(target.id==='confirm-clear-record'){record={sessions:0,best:0,last:0,history:[]};basicRecord={seen:[],firstCorrect:[],missed:[]};session=null;quiz=null;write(RECORD,record);write(BASIC,basicRecord);write(SESSION,null);renderHome();return}
 if(target.hasAttribute('data-recipe')){selected=target.dataset.recipe;renderLibrary();$('#recipe-detail').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(target.hasAttribute('data-practice-recipe')){startSession([recipes.find(r=>r.id===target.dataset.practiceRecipe)],3,'guided');return}
 if(target.id==='edit-selected'){editing=selected;setView('settings');return}
 if(target.hasAttribute('data-edit')){if(!canLeave())return;editing=target.dataset.edit;renderSettings();return}
 if(target.id==='new-recipe'){if(!canLeave())return;if(recipes.length>=30){showToast('음료는 30개까지 등록할 수 있습니다.');return}editing=null;renderSettings();$('#recipe-name').focus();return}
 if(target.id==='duplicate-recipe'){if(!canLeave())return;const r=recipes.find(v=>v.id===editing);if(!r)return;const draft=copy(r);draft.id=uid();draft.name=(r.name.slice(0,31)+' 복제').slice(0,40);draft.confirmed=false;try{validate([...recipes,draft]);editing=draft.id;commitRecipes([...recipes,draft],'음료를 복제했습니다. 이름과 컵 크기를 바꿔 저장하세요.')}catch(error){showToast(error.message)}return}
 if(target.id==='add-quantity'){const count=document.querySelectorAll('.quantity-row').length;if(count>=8){showToast('계량 재료는 8개까지 입력할 수 있습니다.');return}$('#quantity-rows').insertAdjacentHTML('beforeend',quantityRow(undefined,count));formDirty=true;return}
 if(target.hasAttribute('data-remove-quantity')){target.closest('.quantity-row').remove();formDirty=true;return}
 if(target.id==='delete-recipe'){if(!editing||recipes.length<=1)return;commitRecipes(recipes.filter(r=>r.id!==editing),'음료를 삭제했습니다. 직전 변경 되돌리기로 복원할 수 있습니다.');return}
 if(target.id==='export-recipes'){download(JSON.stringify({format:'cafe-first-day-v2',recipes},null,2),'application/json','카페-첫날-레시피.json');return}
 if(target.id==='import-trigger'){if(!canLeave())return;$('#import-file').click();return}
 if(target.id==='apply-import'&&pendingImport){const next=pendingImport;pendingImport=null;commitRecipes(next,'레시피를 불러왔습니다.');return}
 if(target.id==='cancel-import'){pendingImport=null;$('#import-preview').innerHTML='';return}
 if(target.id==='undo-recipes'){if(!canLeave())return;const previous=recipeBackup;if(previous){try{commitRecipes(validate(previous),'직전 레시피 변경을 되돌렸습니다.')}catch(error){showToast(error.message)}}return}
 if(target.id==='reset-recipes'){if(!canLeave())return;commitRecipes(defaults,'예시로 초기화했습니다. 직전 변경 되돌리기로 복원할 수 있습니다.');return}
 if(target.id==='print-recipes'){printRecipes();return}
 if(target.id==='print-checklist'){printContent('<h1>카페 첫날 · 현장 교육 확인</h1><p>교육생: ____________________  교육 담당자: ____________________</p><p>날짜: ____________________</p>'+checklist.map(([name,detail])=>`<div class="print-recipe"><strong>□ ${E(name)}</strong><p>${E(detail)}</p><p>메모: ________________________________________________________</p></div>`).join(''));return}
 if(target.id==='print-result'){printContent(`<h1>카페 첫날 · 실습 결과</h1><p>${E(new Date().toLocaleDateString('ko-KR'))} · ${session.mode==='guided'?'따라 배우기':'혼자 풀기'} · ${session.queue.length}잔 · ${record.last}점</p><p>실수 ${session.mistakes}회 · 실제 제조 숙련도를 판정하는 결과가 아닙니다.</p>${session.logs.map(v=>`<div class="print-recipe"><strong>${E(v.name)}</strong><p>복습 기준: ${E(v.expected)}</p><p>${E(v.why)}</p></div>`).join('')}`);return}
});
let draggedIngredient=null;
document.addEventListener('dragstart',e=>{const button=e.target.closest('.ingredient-button');if(!button||button.disabled)return;draggedIngredient=button.dataset.answer;e.dataTransfer.setData('text/plain',draggedIngredient);e.dataTransfer.effectAllowed='copy'});
document.addEventListener('dragover',e=>{const zone=e.target.closest('#cup-drop');if(zone&&draggedIngredient&&session?.stage==='steps'){e.preventDefault();e.dataTransfer.dropEffect='copy';zone.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{const zone=e.target.closest('#cup-drop');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const zone=e.target.closest('#cup-drop');if(!zone||!draggedIngredient)return;e.preventDefault();const key=draggedIngredient;draggedIngredient=null;zone.classList.remove('drag-over');if(session?.stage==='steps')choose(key)});
document.addEventListener('dragend',()=>{draggedIngredient=null;$('#cup-drop')?.classList.remove('drag-over')});
setView('home',false);
})();
</script>
</body>
</html>
